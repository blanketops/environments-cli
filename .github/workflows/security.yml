# =============================================================================
# security.yml — Known-Vulnerability Scanning (govulncheck)
#
# Known-vulnerability scanning (govulncheck) against the Go dependency
# graph. Source-level static analysis lives separately in codeql.yml —
# these two don't share a file just because they're both "security".
# Triggers on push/PR like cli.yml, plus a weekly schedule so newly
# disclosed CVEs are caught even when nothing in the repo has changed.
#
# Trigger scope:
#   push to develop/main; pull_request to develop; weekly schedule
#
# Secrets required: none
# =============================================================================
name: Security

on:
  push:
    branches:
      - develop
      - main
  pull_request:
    branches: [develop]
  schedule:
    - cron: "0 6 * * 1" # Mondays 06:00 UTC

permissions:
  contents: read

jobs:
  govulncheck:
    runs-on: self-hosted
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout repo
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false

      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@latest

      - name: Run govulncheck (JSON)
        run: govulncheck -format json ./... > govulncheck.json || true

      - name: Run govulncheck (SARIF)
        run: govulncheck -format sarif ./... > govulncheck.raw.sarif || true

      - name: Sanitize SARIF
        run: |
          if [ -s govulncheck.raw.sarif ]; then
            jq 'walk(if type == "object" then
                 (if (.tags | type) == "array" then .tags |= unique else . end)
                 | (if (.stacks | type) == "array" then .stacks |= unique else . end)
               else . end)' \
               govulncheck.raw.sarif > govulncheck.sarif
          else
            echo '{"schemaVersion": 2, "results": []}' > govulncheck.sarif
          fi

      - name: Upload SARIF to Security tab
        uses: github/codeql-action/upload-sarif@v4.39.1
        with:
          sarif_file: govulncheck.sarif
          category: govulncheck

      - name: Tabulate results
        id: tabulate
        run: |
          count=$(jq -s '[.[] | select(.finding != null) | .finding.osv] | unique | length' govulncheck.json)
          echo "count=$count" >> "$GITHUB_OUTPUT"

          {
            echo "## 🛡️ govulncheck"
            echo ""
            if [ "$count" -eq 0 ]; then
              echo "**Status:** ✅ No known vulnerabilities in reachable code paths."
            else
              echo "**Status:** ⚠️ $count advisories affect reachable code paths (non-blocking)."
            fi
            echo ""
            if [ "$count" -gt 0 ]; then
              echo "| Advisory | Package | Fixed in | Call paths |"
              echo "| --- | --- | --- | --- |"
              jq -s -r '
                [ .[] | select(.finding != null) | .finding ]
                | group_by(.osv)
                | map(.[0] + {count: length})
                | sort_by(.osv)
                | .[]
                | "| [\\(.osv)](https://pkg.go.dev/vuln/\\(.osv)) | \\(.trace[0].package // .trace[0].module // \"stdlib\") | \\(.fixed_version) | \\(.count) |"
              ' govulncheck.json
              echo ""
              echo "Full findings, including call traces: **Security → Code scanning alerts**."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Findings notice
        if: steps.tabulate.outputs.count != '0'
        run: echo "::warning::govulncheck found ${{ steps.tabulate.outputs.count }} advisories in reachable code paths — see the job summary and Security tab. Not blocking CI while the project is pre-1.0."